<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>معلمي الذكي المتقدم - تعلم الإنجليزية باستمتاع</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Fredoka:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Cairo', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            color: #1e293b;
            overflow-x: hidden;
        }

        .font-english {
            font-family: 'Fredoka', cursive, sans-serif;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .animate-float {
            animation: float 3s infinite ease-in-out;
        }

        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-pop {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }

        .touch-target {
            min-height: 64px;
            min-width: 64px;
        }

        canvas {
            touch-action: none;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="bg-white shadow-lg px-4 py-3 sticky top-0 z-50 flex items-center justify-between border-b-4 border-emerald-500">
        <div class="flex items-center gap-3">
            <button onclick="navigateHome()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-black px-5 py-3 rounded-2xl shadow-md touch-target flex items-center gap-2 text-xl transition transform active:scale-95">
                🏠 <span class="hidden sm:inline">الرئيسية</span>
            </button>
            <div id="header-title" class="text-lg sm:text-2xl font-black text-emerald-700">مرحباً بك يا سارة! 🌟</div>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="renderBadgesScreen()" class="bg-amber-100 hover:bg-amber-200 border-2 border-amber-300 px-3 py-2 rounded-2xl flex items-center gap-2 shadow-inner touch-target transition transform active:scale-95">
                <span class="text-2xl">🏆</span>
                <span id="badge-count" class="text-lg font-black text-amber-800 font-english">0</span>
            </button>
            <div class="bg-amber-500 text-white px-4 py-2 rounded-2xl flex items-center gap-2 shadow-md font-black text-lg">
                <span>⭐</span>
                <span id="star-count" class="font-english">0</span>
            </div>
            <button onclick="toggleAudioLang()" id="audio-toggle-btn" class="bg-sky-100 hover:bg-sky-200 text-sky-800 font-bold px-3 py-2 rounded-2xl border-2 border-sky-300 text-sm flex items-center gap-1 shadow touch-target">

            </button>
        </div>
    </header>

    <main id="app-container" class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-center items-center">
        <!-- Dynamic views rendered here -->
    </main>

            <button onclick="closeModal()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black text-xl py-4 rounded-2xl shadow-lg touch-target transition transform active:scale-95">
                استمر يا بطل ✨

        const BADGES_LIST = [

        // Persistent App State
        let appState = {
            stars: parseInt(localStorage.getItem('kids_stars')) || 0,
            completedLetters: JSON.parse(localStorage.getItem('kids_completed_letters')) || {},
            tracesCount: parseInt(localStorage.getItem('kids_traces_count')) || 0,
            gamesWon: parseInt(localStorage.getItem('kids_games_won')) || 0,
            unlockedBadges: JSON.parse(localStorage.getItem('kids_badges')) || []
        };

        function saveState() {
            localStorage.setItem('kids_stars', appState.stars);
            localStorage.setItem('kids_completed_letters', JSON.stringify(appState.completedLetters));
            localStorage.setItem('kids_traces_count', appState.tracesCount);
            localStorage.setItem('kids_games_won', appState.gamesWon);
            localStorage.setItem('kids_badges', JSON.stringify(appState.unlockedBadges));
            updateHeaderUI();
            checkBadgesUnlock();
        }

        function updateHeaderUI() {
            document.getElementById('star-count').innerText = appState.stars;
            document.getElementById('badge-count').innerText = appState.unlockedBadges.length;
        }

        function addStars(amount) {
            appState.stars += amount;
            saveState();
            showEncouragement(amount);
        }

        function showEncouragement(starsEarned) {
            const modal = document.getElementById('feedback-modal');
            const emojis = ['🌟', '🎉', '🏆', '⭐', '🎈'];
            const titles = ['ممتاز جداً!', 'رائع يا بطل!', 'أنت عبقري!', 'بطل المستقبل!'];
            document.getElementById('modal-emoji').innerText = emojis[Math.floor(Math.random() * emojis.length)];
            document.getElementById('modal-title').innerText = titles[Math.floor(Math.random() * titles.length)];
            document.getElementById('modal-desc').innerText = `لقد ربحت ${starsEarned} نجوم جديدة! استمر في التألق.`;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('feedback-modal').classList.add('hidden');
        }

        function checkBadgesUnlock() {
            BADGES_LIST.forEach(badge => {
                if (!appState.unlockedBadges.includes(badge.id)) {
                    let unlocked = false;
                    if (badge.type === 'stars' && appState.stars >= badge.req) unlocked = true;
                    if (badge.type === 'letters' && Object.keys(appState.completedLetters).length >= badge.req) unlocked = true;
                    if (badge.type === 'traces' && appState.tracesCount >= badge.req) unlocked = true;
                    if (badge.type === 'games' && appState.gamesWon >= badge.req) unlocked = true;

                    if (unlocked) {
                        appState.unlockedBadges.push(badge.id);
                        localStorage.setItem('kids_badges', JSON.stringify(appState.unlockedBadges));
                        showBadgeUnlockedModal(badge);
                    }
                }
            });
        }

        function showBadgeUnlockedModal(badge) {
            const modal = document.getElementById('feedback-modal');
            document.getElementById('modal-emoji').innerText = badge.icon;
            document.getElementById('modal-title').innerText = `وسام جديد مفتوح: ${badge.title}`;
            document.getElementById('modal-desc').innerText = badge.desc;
            modal.classList.remove('hidden');
        }

        // Web Speech API Wrapper
        function speak(text, lang = 'en-US') {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        let audioEnabled = true;
        function toggleAudioLang() {
            audioEnabled = !audioEnabled;
            speak(audioEnabled ? 'Audio enabled' : 'Audio disabled', audioEnabled ? 'en-US' : 'ar-SA');
        }

            renderHomeScreen();
        }

        let traceIdx = 0;
        function changeTracingIdx(dir) {
            traceIdx = (traceIdx + dir + ALPHABET_DEEP_DATA.length) % ALPHABET_DEEP_DATA.length;
            const letter = ALPHABET_DEEP_DATA[traceIdx];
            document.getElementById('tracing-display').innerText = `${letter.char} ${letter.lower}`;
            document.getElementById('canvas-guide').innerText = letter.char;
            clearCanvas();
        }

        let canvas, ctx, drawing = false, brushColor = '#d97706';
        function initCanvas() {
            canvas = document.getElementById('draw-canvas');
            ctx = canvas.getContext('2d');
            ctx.lineWidth = 14;
            ctx.lineCap = 'round';
            ctx.strokeStyle = brushColor;

            canvas.onmousedown = startDraw;
            canvas.onmousemove = draw;
            canvas.onmouseup = stopDraw;
            canvas.onmouseleave = stopDraw;

            canvas.ontouchstart = (e) => { e.preventDefault(); startDraw(e.touches[0]); };
            canvas.ontouchmove = (e) => { e.preventDefault(); draw(e.touches[0]); };
            canvas.ontouchend = stopDraw;
        }

        function setBrushColor(color) {
            brushColor = color;
            if (ctx) ctx.strokeStyle = brushColor;
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX || e.pageX) - rect.left,
                y: (e.clientY || e.pageY) - rect.top
            };
        }

        function startDraw(e) {
            drawing = true;
            const pos = getMousePos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        function draw(e) {
            if (!drawing) return;
            const pos = getMousePos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function stopDraw() {
            drawing = false;
        }

        function clearCanvas() {
            if (ctx && canvas) ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function finishTracing() {
            appState.tracesCount++;

                <div class="flex items-center justify-between w-full mb-6">
                    <button onclick="renderGamesMenu()" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold px-4 py-2 rounded-2xl touch-target">⬅ الألعاب</button>
                    <div class="text-xl font-bold text-indigo-700">ابحث عن البطاقات المتطابقة</div>
                    <div class="w-16"></div>
                </div>

                <div class="grid grid-cols-4 gap-4 max-w-lg w-full" id="memory-board">
                    ${deck.map((item, idx) => `
                        <button id="card-${idx}" data-char="${item.char}" onclick="flipMemoryCard(${idx}, '${item.char}')" class="h-28 bg-indigo-500 hover:bg-indigo-600 border-4 border-indigo-300 rounded-2xl text-4xl font-black text-white flex items-center justify-center shadow-lg touch-target transition transform active:scale-95">
                            ❓
                        </button>
                    `).join('')}
                </div>
            `;
        }

        let memFirst = null, memLock = false, memMatches = 0;
        function flipMemoryCard(idx, char) {
            if (memLock) return;
            const btn = document.getElementById(`card-${idx}`);
            if (btn.classList.contains('revealed')) return;

            btn.innerText = char;
            btn.classList.remove('bg-indigo-500');
            btn.classList.add('bg-white', 'text-indigo-700', 'revealed');

            if (!memFirst) {
                memFirst = { idx, char };
            } else {
                if (memFirst.char === char) {
                    memFirst = null;
                    memMatches++;
                    if (memMatches === 4) {
                        appState.gamesWon++;
                        addStars(4);
                        saveState();
                        setTimeout(() => startMemoryGame(), 1500);
                    }
                } else {
                    memLock = true;
                    setTimeout(() => {
                        document.getElementById(`card-${memFirst.idx}`).innerText = '❓';
                        document.getElementById(`card-${memFirst.idx}`).classList.remove('bg-white', 'text-indigo-700', 'revealed');
                        document.getElementById(`card-${memFirst.idx}`).classList.add('bg-indigo-500');

                        btn.innerText = '❓';
                        btn.classList.remove('bg-white', 'text-indigo-700', 'revealed');
                        btn.classList.add('bg-indigo-500');

                        memFirst = null;
                        memLock = false;
                    }, 1000);
                }
            }
        }

        // --- GAME 3: LISTEN & CHOOSE ---
        function startListenGame() {
            const container = document.getElementById('app-container');
            let target = ALPHABET_DEEP_DATA[Math.floor(Math.random() * ALPHABET_DEEP_DATA.length)];
            let options = [target];
            while (options.length < 3) {
                let rand = ALPHABET_DEEP_DATA[Math.floor(Math.random() * ALPHABET_DEEP_DATA.length)];
                if (!options.includes(rand)) options.push(rand);
            }
            options.sort(() => 0.5 - Math.random());

            document.getElementById('header-title').innerText = 'استمع واختر';

            container.innerHTML = `
                <div class="flex items-center justify-between w-full mb-6">
                    <button onclick="renderGamesMenu()" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold px-4 py-2 rounded-2xl touch-target">⬅ الألعاب</button>
                    <div class="text-2xl font-black text-amber-700">استمع للصوت واكتشف الكلمة الصحيحة</div>
                    <div class="w-16"></div>
                </div>

                <div class="bg-white border-8 border-amber-300 rounded-3xl p-8 shadow-2xl max-w-md w-full text-center flex flex-col items-center">
                    <button onclick="speak('${target.words[0].en}')" class="bg-amber-500 hover:bg-amber-600 text-white font-black text-3xl p-6 rounded-3xl shadow-xl mb-6 touch-target flex items-center gap-3">
                        🔊 اضغط للاستماع
                    </button>
                    <div class="grid grid-cols-3 gap-4 w-full">
                        ${options.map(opt => `
                            <button onclick="checkListenAnswer('${opt.words[0].en}', '${target.words[0].en}')" class="bg-amber-100 hover:bg-amber-200 border-4 border-amber-400 text-amber-900 p-4 rounded-2xl shadow-lg touch-target flex flex-col items-center">
                                <span class="text-4xl mb-1">${opt.words[0].emoji}</span>
                                <span class="font-english font-black text-lg">${opt.words[0].en}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
            speak(target.words[0].en);
        }

        function checkListenAnswer(selected, correct) {
            if (selected === correct) {
                appState.gamesWon++;
                addStars(3);
                saveState();
                setTimeout(() => startListenGame(), 1200);
            } else {
                speak('Try again');
                alert('حاول مرة أخرى يا بطل!');
            }
        }

        // --- GAME 4: WORD BUILDER / SPELLING ---
        function startSpellingGame() {
            const container = document.getElementById('app-container');
            const wordsList = ['cat', 'dog', 'sun', 'hat', 'cup', 'pen', 'bus', 'red'];
            let targetWord = wordsList[Math.floor(Math.random() * wordsList.length)];
            let letters = targetWord.split('').sort(() => 0.5 - Math.random());

            let targetItem = THEMATIC_CATEGORIES.animals.words.find(w => w.en.toLowerCase() === targetWord) ||
                             THEMATIC_CATEGORIES.food.words.find(w => w.en.toLowerCase() === targetWord) ||
                             {en: targetWord, ar: 'كلمة سهلة', emoji: '⭐'};

            document.getElementById('header-title').innerText = 'تركيب الكلمات';

            let selectedLetters = [];

            container.innerHTML = `
                <div class="flex items-center justify-between w-full mb-6">
                    <button onclick="renderGamesMenu()" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold px-4 py-2 rounded-2xl touch-target">⬅ الألعاب</button>
                    <div class="text-2xl font-black text-emerald-700">رتّب الحروف لتكوين الكلمة الصحيحة</div>
                    <div class="w-16"></div>
                </div>

                <div class="bg-white border-8 border-emerald-300 rounded-3xl p-8 shadow-2xl max-w-md w-full text-center flex flex-col items-center">
                    <div class="text-7xl mb-4">${targetItem.emoji || '⭐'}</div>
                    <div id="spelling-slot" class="text-4xl font-black font-english text-emerald-700 tracking-widest min-h-[60px] bg-emerald-50 border-2 border-emerald-200 w-full rounded-2xl flex items-center justify-center mb-6">
                        _ _ _
                    </div>
                    <div class="flex gap-3 justify-center mb-6" id="spelling-tiles">
                        ${letters.map((l, i) => `
                            <button onclick="selectSpellingLetter('${l}', this, '${targetWord}')" class="bg-emerald-500 hover:bg-emerald-600 text-white font-black text-3xl w-16 h-16 rounded-2xl shadow-lg font-english touch-target">
                                ${l}
                            </button>
                        `).join('')}
                    </div>
                    <button onclick="startSpellingGame()" class="bg-slate-200 text-slate-700 font-bold px-4 py-2 rounded-xl">كلمة أخرى 🔄</button>
                </div>
            `;
            window.currentSpelling = { target: targetWord, current: '' };
        }

        function selectSpellingLetter(letter, btn, target) {
            btn.style.opacity = '0.3';
            btn.disabled = true;
            window.currentSpelling.current += letter;
            document.getElementById('spelling-slot').innerText = window.currentSpelling.current;

            if (window.currentSpelling.current === target) {
                appState.gamesWon++;
                addStars(4);
                saveState();
                setTimeout(() => startSpellingGame(), 1200);
            } else if (window.currentSpelling.current.length === target.length) {
                speak('Try again');
                alert('حاول مرة أخرى!');
                startSpellingGame();
            }
        }

        // --- GAME 5: PICTURE TO WORD MATCH ---
        function startPicWordGame() {
            const container = document.getElementById('app-container');
            let pool = THEMATIC_CATEGORIES.animals.words;
            let target = pool[Math.floor(Math.random() * pool.length)];
            let options = [target];
            while (options.length < 3) {
                let rand = pool[Math.floor(Math.random() * pool.length)];
                if (!options.includes(rand)) options.push(rand);
            }
            options.sort(() => 0.5 - Math.random());

            document.getElementById('header-title').innerText = 'الصورة والكلمة';

            container.innerHTML = `
                <div class="flex items-center justify-between w-full mb-6">
                    <button onclick="renderGamesMenu()" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold px-4 py-2 rounded-2xl touch-target">⬅ الألعاب</button>
                    <div class="text-2xl font-black text-blue-700">اختر الكلمة الإنجليزية المناسبة للصورة</div>
                    <div class="w-16"></div>
                </div>

                <div class="bg-white border-8 border-blue-300 rounded-3xl p-8 shadow-2xl max-w-md w-full text-center flex flex-col items-center">
                    <div class="text-8xl mb-6 animate-float">${target.emoji}</div>
                    <div class="text-xl font-bold text-slate-700 mb-6">${target.ar}</div>
                    <div class="grid grid-cols-3 gap-4 w-full">
                        ${options.map(opt => `
                            <button onclick="checkPicWordAnswer('${opt.en}', '${target.en}')" class="bg-blue-100 hover:bg-blue-200 border-4 border-blue-400 text-blue-900 font-black font-english text-xl py-4 rounded-2xl shadow-lg touch-target">
                                ${opt.en}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
            speak(target.en);
        }

        function checkPicWordAnswer(selected, correct) {
            if (selected === correct) {
                appState.gamesWon++;
                addStars(3);
                saveState();
                setTimeout(() => startPicWordGame(), 1200);
            } else {
                speak('Try again');
                alert('حاول مرة أخرى!');
            }
        }

        function renderBadgesScreen() {
            const container = document.getElementById('app-container');
            document.getElementById('header-title').innerText = 'أوسمتي وإنجازاتي';

            container.innerHTML = `
                <div class="flex items-center justify-between w-full mb-6">
                    <button onclick="navigateHome()" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold px-4 py-2 rounded-2xl touch-target">⬅ عودة</button>
                    <h2 class="text-2xl sm:text-3xl font-black text-amber-700">سجل إنجازاتك الرائعة</h2>
                    <div class="w-16"></div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 w-full max-w-4xl">
                    ${BADGES_LIST.map(badge => {
                        let unlocked = appState.unlockedBadges.includes(badge.id);
                        return `
                            <div class="bg-white border-4 ${unlocked ? 'border-amber-400 bg-amber-50/50' : 'border-slate-200 opacity-60'} p-6 rounded-3xl shadow-xl flex items-center gap-4">
                                <span class="text-6xl">${badge.icon}</span>
                                <div>
                                    <h3 class="text-xl font-black text-slate-800">${badge.title}</h3>
                                    <p class="text-sm text-slate-600">${badge.desc}</p>
                                    <span class="inline-block mt-2 text-xs font-bold px-3 py-1 rounded-full ${unlocked ? 'bg-amber-200 text-amber-900' : 'bg-slate-200 text-slate-600'}">
                                        ${unlocked ? '✨ تم الفتح' : '🔒 مغلق'}
                                    </span>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        // Initialize App on Window Load
        window.onload = function() {
            renderHomeScreen();
            updateHeaderUI();
        };
    </script>
</body>
</html>
